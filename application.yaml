apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background

spec:
  project: default

  source:
    repoURL: https://github.com/Vyshak1234/image_updator_test.git
    targetRevision: master
    path: charts
    helm:
      valueFiles:
        - charts/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true